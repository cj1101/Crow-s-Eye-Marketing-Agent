runtime: python39

# Production-grade resource allocation
instance_class: F2
automatic_scaling:
  min_instances: 1
  max_instances: 10
  min_idle_instances: 1
  max_idle_instances: 2
  min_pending_latency: 30ms
  max_pending_latency: 3s
  target_cpu_utilization: 0.65
  target_throughput_utilization: 0.6

# Environment variables with security considerations
# CRITICAL: Set JWT_SECRET_KEY via gcloud secrets manager in production
env_variables:
  # Database configuration
  DATABASE_URL: "sqlite:////tmp/crow_eye_production.db"
  
  # Security configuration
  # JWT_SECRET_KEY: "SET_THIS_VIA_GCLOUD_SECRETS_MANAGER"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  
  # Application configuration
  PROJECT_NAME: "Crow's Eye API - Production"
  API_V1_STR: "/api/v1"
  
  # Google Cloud configuration
  GOOGLE_CLOUD_PROJECT: "crows-eye-website"
  GOOGLE_CLOUD_STORAGE_BUCKET: "crow-eye-storage"
  
  # Security settings
  RATE_LIMIT_ENABLED: "true"
  SECURITY_HEADERS_ENABLED: "true"
  CORS_ORIGINS: "https://crow-eye-api-dot-crows-eye-website.uc.r.appspot.com,https://crows-eye-website.uc.r.appspot.com"
  
  # Logging configuration
  LOG_LEVEL: "INFO"
  STRUCTURED_LOGGING: "true"

# Health check configuration
readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300

liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2
  initial_delay_sec: 300

# Network configuration
network:
  forwarded_ports:
    - 8080

# Security settings
entrypoint: gunicorn -b :$PORT -w 4 -k uvicorn.workers.UvicornWorker --timeout 120 --keepalive 2 --max-requests 1000 --max-requests-jitter 50 --preload crow_eye_api.main:app

# Error handling
error_handlers:
  - file: error_pages/default_error.html
  - error_code: over_quota
    file: error_pages/over_quota.html

# Skip files for security and performance
skip_files:
  - ^(.*/)?#.*#$
  - ^(.*/)?.*~$
  - ^(.*/)?.*\.py[co]$
  - ^(.*/)?.*/RCS/.*$
  - ^(.*/)?\..*$
  - ^(.*/)?.*\.bak$
  - ^(.*/)?node_modules/.*$
  - ^(.*/)?\.git/.*$
  - ^(.*/)?\.hg/.*$
  - ^(.*/)?\.svn/.*$
  - ^(.*/)?tests/.*$
  - ^(.*/)?test_.*\.py$
  - ^(.*/)?.*_test\.py$
  - ^(.*/)?\.coverage$
  - ^(.*/)?\.pytest_cache/.*$
  - ^(.*/)?__pycache__/.*$
  - ^(.*/)?\.DS_Store$
  - ^(.*/)?Thumbs\.db$
  - ^(.*/)?.*\.log$
  - ^(.*/)?.*\.md$
  - ^(.*/)?LICENSE$
  - ^(.*/)?README.*$
  - ^(.*/)?docs/.*$

# Resource allocation
resources:
  cpu: 1
  memory_gb: 1
  disk_size_gb: 10

handlers:
- url: /.*
  script: auto
  secure: always 